<!DOCTYPE html>
<html lang="th" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Swing Trader Pro V8.5 — Fact-Based Multi-Market Scanner</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Prompt', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          },
          colors: {
            dark: {
              950: '#060911',
              900: '#0b1120',
              850: '#0f172a',
              800: '#1e293b',
              700: '#334155'
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #060911;
      color: #f8fafc;
      font-family: 'Prompt', sans-serif;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0b1120;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
    .badge-glow {
      box-shadow: 0 0 15px -3px currentColor;
    }
  </style>
</head>
<body class="min-h-screen bg-[#060911] text-slate-100 selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Presets
    const PRESETS = [
      { id: 'ALL', name: '🎯 All Quality Setups', desc: 'หุ้นพื้นฐานเทคนิคทรงสวย คะแนนรวม 60+' },
      { id: 'NEW_ENTRANT', name: '✨ Fresh Breakout (ต้นรอบ)', desc: 'พึ่งติดวันแรก ราคายังอยู่ใกล้แนวรับ EMA20 ไม่ไล่ราคาเกิน 4.5%' },
      { id: 'BREAKOUT', name: '🚀 Volume Breakout', desc: 'เบรคทะลุ High วอลุ่มพุ่งแรง (RVOL > 115%)' },
      { id: 'POCKET_PIVOT', name: '💎 Pocket Pivot', desc: 'เงินใหญ่สะสมในกรอบฐาน เหนือ EMA10/20' },
      { id: 'VCP', name: '🌪️ VCP Squeeze', desc: 'กรอบแคบมาก (<5.5%) วอลุ่มแห้ง รอกระชาก' },
      { id: 'EMA20_BOUNCE', name: '📈 EMA20 Bounce', desc: 'ย่อแตะแนวรับ EMA20 ดึงกลับสู้ทันที' },
      { id: 'RS_LEADER', name: '👑 RS Monster', desc: 'หุ้นแกร่งกว่าตลาด แรลลี่นำกลุ่ม (RS > 65)' },
      { id: 'MACD_MOMENTUM', name: '⚡ Momentum Rise', desc: 'เส้นค่าเฉลี่ยเรียงตัวสวย โมเมนตัมพุ่ง' },
    ];

    // Thai Universes
    const THAI_UNIVERSES = [
      { id: 'ALL', name: 'ทั้งตลาด (SET+mai)', count: '880+ ตัว', icon: '🌐' },
      { id: 'SET100', name: 'SET100', count: '100 ตัว', icon: '🏆' },
      { id: 'SET50', name: 'SET50', count: '50 ตัว', icon: '💎' },
      { id: 'SSET', name: 'sSET (กลาง-เล็ก)', count: '110+ ตัว', icon: '⚡' },
      { id: 'SETHD', name: 'SETHD (ปันผลสูง)', count: '30 ตัว', icon: '💰' },
      { id: 'MAI', name: 'mai Market', count: '200+ ตัว', icon: '🚀' },
      { id: 'CUSTOM', name: 'กำหนดเอง', count: 'ตามสั่ง', icon: '✏️' }
    ];

    // US Universes
    const US_UNIVERSES = [
      { id: 'ALL', name: 'ทั้งตลาด US (รวม ADR / TSM / ASML)', count: '500+ ตัวยอดนิยม', icon: '🌐' },
      { id: 'SEMIS', name: 'Semiconductors & AI (ชิป & เทค)', count: '30 ชิประดับโลก', icon: '⚡' },
      { id: 'SP500', name: 'S&P 500 (VOO)', count: '500 หุ้นใหญ่', icon: '🏛️' },
      { id: 'NASDAQ100', name: 'NASDAQ 100 (QQQM)', count: '101 เทคยักษ์', icon: '💻' },
      { id: 'MAG7', name: 'Magnificent 7', count: '7 ยักษ์ใหญ่', icon: '💎' },
      { id: 'VUG', name: 'Growth (VUG)', count: '50 หุ้นเติบโต', icon: '🚀' },
      { id: 'SCHD', name: 'Dividend (SCHD)', count: '50 หุ้นปันผล', icon: '💰' },
      { id: 'CUSTOM', name: 'กำหนดเอง', count: 'ตามสั่ง', icon: '✏️' }
    ];

    const DEFAULT_THAI_STOCKS = [
      'DELTA','PTT','ADVANC','GULF','AOT','KTB','PTTEP','KBANK','SCB','TRUE',
      'CPALL','BDMS','BBL','CPAXT','BH','MINT','CRC','CPF','TOP','PTTGC',
      'INTUCH','WHA','BGRIM','CBG','IVL','GPSC','HMPRO','SCGP','OR','TISCO'
    ];

    const DEFAULT_US_STOCKS = [
      'NVDA','AAPL','MSFT','AMZN','GOOGL','META','TSLA','TSM','AVGO','ASML',
      'COST','NFLX','AMD','ADBE','QCOM','ARM','TXN','INTU','AMGN','ISRG',
      'AMAT','BKNG','PANW','MU','LRCX','ADI','KLAC','CRWD','PLTR','LLY'
    ];

    // Market-aware date helper (100% Fact: Weekends rollback to Friday's completed session)
    const getMarketActiveDate = (mkt = 'TH') => {
      const now = new Date();
      const timeZone = mkt === 'US' ? 'America/New_York' : 'Asia/Bangkok';
      const weekdayStr = new Intl.DateTimeFormat('en-US', { timeZone, weekday: 'short' }).format(now);
      const hourStr = new Intl.DateTimeFormat('en-US', { timeZone, hour: 'numeric', hour12: false }).format(now);
      const hour = parseInt(hourStr, 10);
      const minuteStr = new Intl.DateTimeFormat('en-US', { timeZone, minute: 'numeric' }).format(now);
      const minute = parseInt(minuteStr, 10);

      const isBeforeOpen = mkt === 'TH' ? hour < 10 : (hour < 9 || (hour === 9 && minute < 30));

      let daysToSubtract = 0;
      if (weekdayStr === 'Sat') {
        daysToSubtract = 1;
      } else if (weekdayStr === 'Sun') {
        daysToSubtract = 2;
      } else if (weekdayStr === 'Mon') {
        daysToSubtract = isBeforeOpen ? 3 : 0;
      } else {
        daysToSubtract = isBeforeOpen ? 1 : 0;
      }

      const targetTime = new Date(now.getTime() - daysToSubtract * 24 * 60 * 60 * 1000);
      return new Intl.DateTimeFormat('en-CA', {
        timeZone,
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      }).format(targetTime);
    };

    const getPastDateStr = (daysAgo, mkt = 'TH') => {
      const baseStr = getMarketActiveDate(mkt);
      const parts = baseStr.split('-');
      const d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
      d.setDate(d.getDate() - daysAgo);
      const timeZone = mkt === 'US' ? 'America/New_York' : 'Asia/Bangkok';
      return new Intl.DateTimeFormat('en-CA', {
        timeZone,
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      }).format(d);
    };

    const formatMoney = (val, currency = '฿') => {
      if (!val && val !== 0) return '-';
      if (val >= 1000000000) return `${currency}${(val / 1000000000).toFixed(2)}B`;
      if (val >= 1000000) return `${currency}${(val / 1000000).toFixed(1)}M`;
      return `${currency}${new Intl.NumberFormat('en-US').format(Math.round(val))}`;
    };

    const playScanAlert = () => {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
      } catch (e) {}
    };

    function App() {
      const [market, setMarket] = useState('TH');
      const currency = market === 'TH' ? '฿' : '$';

      const activeSessionDate = useMemo(() => getMarketActiveDate(market), [market]);
      const [selectedDate, setSelectedDate] = useState(() => getMarketActiveDate('TH'));

      const [universe, setUniverse] = useState('ALL');
      const [customStocks, setCustomStocks] = useState(DEFAULT_THAI_STOCKS.join(', '));
      const [selectedPreset, setSelectedPreset] = useState('ALL');
      const [selectedSector, setSelectedSector] = useState('ALL');
      const [minValue, setMinValue] = useState(0);
      const [searchQuery, setSearchQuery] = useState('');
      const [soundEnabled, setSoundEnabled] = useState(true);

      // Scanning & State
      const [scanning, setScanning] = useState(false);
      const [scanProgress, setScanProgress] = useState(0);
      const [activeWorkerTickers, setActiveWorkerTickers] = useState([]);
      const [liveScanStatus, setLiveScanStatus] = useState('');
      const [scanDuration, setScanDuration] = useState(0);
      const [allScannedStocks, setAllScannedStocks] = useState([]);
      const [stats, setStats] = useState(null);
      const [benchmarks, setBenchmarks] = useState([]);
      const [catalysts, setCatalysts] = useState([]);
      const [sectorFlow, setSectorFlow] = useState([]);
      const [portfolioSim, setPortfolioSim] = useState(null);

      // Heatmap View State
      const [viewMode, setViewMode] = useState('table'); // 'table' | 'heatmap'
      const [heatmapTimeframe, setHeatmapTimeframe] = useState('1D'); // '1D' | '1W' | '2W' | '3W' | '4W'
      const [heatmapData, setHeatmapData] = useState([]);

      // Intraday EMA Trend Zone State (H1 / H2 / H4)
      const [intradayFilter, setIntradayFilter] = useState('ALL'); 
      // 'ALL' | 'WINNER_IN_ZONE' | 'TRIPLE' | 'H1_BULL' | 'H2_BULL' | 'H4_BULL' | 'H1_20' | 'H1_50' | 'H1_200' | 'H2_20' | 'H2_50' | 'H2_200' | 'H4_20' | 'H4_50' | 'H4_200'

      // Table Column Sorting State
      const [sortColumn, setSortColumn] = useState('score');
      const [sortDirection, setSortDirection] = useState('desc');

      const handleSort = (col) => {
        if (sortColumn === col) {
          setSortDirection(prev => prev === 'desc' ? 'asc' : 'desc');
        } else {
          setSortColumn(col);
          setSortDirection(col === 'ticker' ? 'asc' : 'desc');
        }
      };

      // Modals
      const [chartSymbol, setChartSymbol] = useState(null);
      const [initialChartTab, setInitialChartTab] = useState('chart');
      const [calcStock, setCalcStock] = useState(null);
      const [showHelpModal, setShowHelpModal] = useState(false);
      const [showPortfolioModal, setShowPortfolioModal] = useState(false);
      const [showCatalystModal, setShowCatalystModal] = useState(false);
      const [errorMsg, setErrorMsg] = useState(null);

      const abortRef = useRef(false);

      // Switch market
      const switchMarket = (newMarket) => {
        if (newMarket === market) return;
        setMarket(newMarket);
        const newDate = getMarketActiveDate(newMarket);
        setSelectedDate(newDate);
        const newUniv = 'ALL';
        setUniverse(newUniv);
        setSelectedSector('ALL');
        setCustomStocks(newMarket === 'TH' ? DEFAULT_THAI_STOCKS.join(', ') : DEFAULT_US_STOCKS.join(', '));
        setAllScannedStocks([]);
        setStats(null);
        setBenchmarks([]);
        setCatalysts([]);
        setSectorFlow([]);
        setHeatmapData([]);
        setPortfolioSim(null);
        startScan(newDate, newUniv, newMarket);
      };

      const isDateInPast = useMemo(() => {
        return selectedDate < activeSessionDate;
      }, [selectedDate, activeSessionDate]);

      const currentUniverses = market === 'TH' ? THAI_UNIVERSES : US_UNIVERSES;

      // Start Scan Engine
      const startScan = async (dateToScan = selectedDate, univToScan = universe, mktToScan = market) => {
        abortRef.current = false;
        setScanning(true);
        setScanProgress(10);
        setLiveScanStatus(`🚀 กำลังเชื่อมต่อ Official API สำหรับ ${mktToScan} (${dateToScan})...`);
        setErrorMsg(null);

        const t0 = Date.now();

        try {
          const payload = {
            market: mktToScan,
            universe: univToScan,
            preset: 'ALL',
            selectedDate: dateToScan,
            minValue,
            customSymbols: univToScan === 'CUSTOM' ? customStocks.split(',').map(s => s.trim().toUpperCase()).filter(Boolean) : []
          };

          // Progress HUD simulation
          const progressInt = setInterval(() => {
            setScanProgress(prev => {
              if (prev >= 90) return prev;
              return prev + Math.floor(Math.random() * 15) + 5;
            });
            const samplePool = mktToScan === 'TH' ? SET50_LIST : US_MAG7;
            const r1 = samplePool[Math.floor(Math.random() * samplePool.length)];
            const r2 = samplePool[Math.floor(Math.random() * samplePool.length)];
            setActiveWorkerTickers([r1, r2]);
          }, 200);

          const res = await fetch('/api/scan', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          clearInterval(progressInt);

          if (!res.ok) {
            throw new Error(`HTTP Error ${res.status}: ${res.statusText}`);
          }

          const data = await res.json();
          if (!data.success) {
            throw new Error(data.error || 'การสแกนล้มเหลว');
          }

          setScanProgress(100);
          setScanDuration((Date.now() - t0) / 1000);
          setAllScannedStocks(data.stocks || []);
          setStats(data.stats || null);
          setBenchmarks(data.benchmarks || []);
          setCatalysts(data.catalysts || []);
          setSectorFlow(data.sectorFlow || []);
          setHeatmapData(data.heatmap || []);
          setPortfolioSim(data.portfolioSim || null);

          setLiveScanStatus(`✅ สแกนเสร็จสิ้น ${data.stocks?.length || 0} ตัว ใน ${(Date.now() - t0) / 1000} วิ`);

          if (soundEnabled) {
            playScanAlert();
          }

        } catch (err) {
          console.error('[Scan Error]', err);
          setErrorMsg(err.message);
          setLiveScanStatus(`❌ เกิดข้อผิดพลาด: ${err.message}`);
        } finally {
          setScanning(false);
          setActiveWorkerTickers([]);
        }
      };

      const stopScan = () => {
        abortRef.current = true;
        setScanning(false);
        setLiveScanStatus('🛑 สั่งหยุดการสแกนแล้ว');
        setActiveWorkerTickers([]);
      };

      const selectUniverseAndScan = (newUnivId) => {
        setUniverse(newUnivId);
        startScan(selectedDate, newUnivId);
      };

      const setDateAndScan = (newDate) => {
        setSelectedDate(newDate);
        startScan(newDate, universe);
      };

      // Preset Counts
      const presetCounts = useMemo(() => {
        const counts = { ALL: allScannedStocks.length };
        PRESETS.forEach(p => {
          if (p.id !== 'ALL') {
            counts[p.id] = allScannedStocks.filter(s => s.matchedPresets && s.matchedPresets.includes(p.id)).length;
          }
        });
        return counts;
      }, [allScannedStocks]);

      // Intraday Zone Counts (H1 / H2 / H4)
      const intradayCounts = useMemo(() => {
        const counts = {
          ALL: allScannedStocks.length,
          WINNER_IN_ZONE: 0,
          TRIPLE: 0,
          H1_BULL: 0,
          H2_BULL: 0,
          H4_BULL: 0
        };
        allScannedStocks.forEach(s => {
          const ie = s.intradayEma;
          if (!ie) return;
          if (ie.isWinnerInZone || (s.outperforms && (ie.h1?.aboveAll || ie.h2?.aboveAll || ie.h4?.aboveAll))) {
            counts.WINNER_IN_ZONE++;
          }
          if (ie.tripleConfluence || (ie.h1?.aboveAll && ie.h2?.aboveAll && ie.h4?.aboveAll)) {
            counts.TRIPLE++;
          }
          if (ie.h1?.aboveAll) counts.H1_BULL++;
          if (ie.h2?.aboveAll) counts.H2_BULL++;
          if (ie.h4?.aboveAll) counts.H4_BULL++;
        });
        return counts;
      }, [allScannedStocks]);

      // Filtered & Sorted Stocks by Preset, Sector, Intraday Zone, Search Query, and Sort Column
      const displayedStocks = useMemo(() => {
        let list = [...allScannedStocks];

        if (selectedPreset !== 'ALL') {
          list = list.filter(s => s.matchedPresets && s.matchedPresets.includes(selectedPreset));
        }

        if (selectedSector !== 'ALL') {
          list = list.filter(s => s.sector === selectedSector);
        }

        // Intraday EMA Trend Zone filter (H1 / H2 / H4)
        if (intradayFilter !== 'ALL') {
          list = list.filter(s => {
            const ie = s.intradayEma;
            if (!ie) return false;
            switch (intradayFilter) {
              case 'WINNER_IN_ZONE':
                return ie.isWinnerInZone || (s.outperforms && (ie.h1?.aboveAll || ie.h2?.aboveAll || ie.h4?.aboveAll));
              case 'TRIPLE':
                return ie.tripleConfluence || (ie.h1?.aboveAll && ie.h2?.aboveAll && ie.h4?.aboveAll);
              case 'H1_BULL':
                return ie.h1?.aboveAll;
              case 'H2_BULL':
                return ie.h2?.aboveAll;
              case 'H4_BULL':
                return ie.h4?.aboveAll;
              case 'H1_20':
                return ie.h1?.above20;
              case 'H1_50':
                return ie.h1?.above50;
              case 'H1_200':
                return ie.h1?.above200;
              case 'H2_20':
                return ie.h2?.above20;
              case 'H2_50':
                return ie.h2?.above50;
              case 'H2_200':
                return ie.h2?.above200;
              case 'H4_20':
                return ie.h4?.above20;
              case 'H4_50':
                return ie.h4?.above50;
              case 'H4_200':
                return ie.h4?.above200;
              default:
                return true;
            }
          });
        }

        if (searchQuery.trim()) {
          const q = searchQuery.trim().toUpperCase();
          list = list.filter(s => s.symbol.toUpperCase().includes(q) || (s.name && s.name.toUpperCase().includes(q)));
        }

        // Apply interactive column sorting
        list.sort((a, b) => {
          let valA, valB;
          switch (sortColumn) {
            case 'score':
              valA = a.compScore ?? 0;
              valB = b.compScore ?? 0;
              break;
            case 'ticker':
              valA = a.symbol ?? '';
              valB = b.symbol ?? '';
              return sortDirection === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
            case 'price':
              valA = a.price ?? 0;
              valB = b.price ?? 0;
              break;
            case 'changePct':
              valA = a.changePct ?? 0;
              valB = b.changePct ?? 0;
              break;
            case 'valueTraded':
              valA = a.valueTraded ?? 0;
              valB = b.valueTraded ?? 0;
              break;
            case 'rvol':
              valA = a.rvol ?? 0;
              valB = b.rvol ?? 0;
              break;
            case 'rsScore':
              valA = a.rsScore ?? 0;
              valB = b.rsScore ?? 0;
              break;
            case 'intraday':
              valA = (a.intradayEma?.tripleConfluence ? 10 : 0) + (a.intradayEma?.isWinnerInZone ? 5 : 0) + (a.intradayEma?.h1?.aboveAll ? 2 : 0) + (a.intradayEma?.h2?.aboveAll ? 2 : 0) + (a.intradayEma?.h4?.aboveAll ? 2 : 0);
              valB = (b.intradayEma?.tripleConfluence ? 10 : 0) + (b.intradayEma?.isWinnerInZone ? 5 : 0) + (b.intradayEma?.h1?.aboveAll ? 2 : 0) + (b.intradayEma?.h2?.aboveAll ? 2 : 0) + (b.intradayEma?.h4?.aboveAll ? 2 : 0);
              break;
            default:
              valA = a.compScore ?? 0;
              valB = b.compScore ?? 0;
          }
          return sortDirection === 'asc' ? valA - valB : valB - valA;
        });

        return list;
      }, [allScannedStocks, selectedPreset, selectedSector, intradayFilter, searchQuery, sortColumn, sortDirection]);

      // Initial scan
      useEffect(() => {
        startScan(selectedDate, universe, market);
      }, []);

      const isHistoricalScan = allScannedStocks[0]?.isHistorical || false;
      const actualTradingDate = allScannedStocks[0]?.scanDate || selectedDate;

      return (
        <div className="min-h-screen bg-[#060911] text-slate-100 flex flex-col pb-16">
          
          {/* TOP STICKY APP BAR */}
          <div className="sticky top-0 z-40 bg-[#080d1a]/95 backdrop-blur-md border-b border-dark-800 shadow-xl">
            <header className="max-w-[1850px] mx-auto px-4 lg:px-6 py-2.5">
              <div className="flex flex-wrap items-center justify-between gap-3">
                
                {/* Brand & Market Switch */}
                <div className="flex items-center space-x-3">
                  <div className="flex items-center space-x-2">
                    <div className="w-8 h-8 rounded-xl bg-gradient-to-tr from-amber-500 via-indigo-600 to-purple-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                      <span className="text-base font-black text-white">⚡</span>
                    </div>
                    <div>
                      <div className="flex items-center space-x-2">
                        <h1 className="font-extrabold text-base tracking-tight font-mono text-white">
                          GLOBAL SWING TRADER
                        </h1>
                        <span className="text-[10px] px-2 py-0.5 rounded-full font-mono bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 font-bold">
                          V8.5 PRO
                        </span>
                        <span className="text-[10px] px-2 py-0.5 rounded-full font-mono bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-bold">
                          ● 100% FACT DATA
                        </span>
                      </div>
                      <p className="text-[11px] text-slate-400 font-mono hidden sm:block">
                        Macro Benchmark Radar • Relative Strength Alpha • Data-Driven Portfolio Simulator
                      </p>
                    </div>
                  </div>

                  {/* Market Switcher */}

    // =========================================================================
    // Multi-Timeframe Sector & Stock Money Rotation Heatmap View (REQUEST 10)
    // =========================================================================
    function MoneyRotationHeatmapView({
      heatmapData = [],
      timeframe = '1D',
      setTimeframe,
      currency = '฿',
      market = 'TH',
      onSelectStock,
      scanDate,
      isHistorical
    }) {
      const [sortBy, setSortBy] = useState('perf'); // 'perf' | 'laggard' | 'volume'
      const [filterQuery, setFilterQuery] = useState('');

      const TIMEFRAMES = [
        { id: '1D', label: '1D (วันสแกน)', title: '1 วันทำการ (Session วันนั้น)' },
        { id: '1W', label: '1W (1 สัปดาห์)', title: '5 วันทำการ' },
        { id: '2W', label: '2W (2 สัปดาห์)', title: '10 วันทำการ' },
        { id: '3W', label: '3W (3 สัปดาห์)', title: '15 วันทำการ' },
        { id: '4W', label: '4W (1 เดือน)', title: '20 วันทำการ' }
      ];

      // Process sectors for current timeframe
      const processedSectors = useMemo(() => {
        if (!heatmapData || heatmapData.length === 0) return [];

        return heatmapData.map(sec => {
          const ret = Number(sec.avgReturns?.[timeframe] ?? 0);
          const rawStocks = sec.stocks || [];

          const filteredStocks = rawStocks.filter(s => {
            if (!filterQuery.trim()) return true;
            const q = filterQuery.trim().toUpperCase();
            return s.symbol.toUpperCase().includes(q) || (s.name && s.name.toUpperCase().includes(q)) || sec.sector.toUpperCase().includes(q);
          });

          // Sort stocks within sector by that timeframe return
          const sortedStocks = [...filteredStocks].sort((a, b) => {
            const retA = Number(a.timeframeReturns?.[timeframe] ?? a.changePct ?? 0);
            const retB = Number(b.timeframeReturns?.[timeframe] ?? b.changePct ?? 0);
            return retB - retA;
          });

          return {
            ...sec,
            currentTfReturn: ret,
            stocks: sortedStocks
          };
        }).filter(sec => sec.stocks.length > 0);
      }, [heatmapData, timeframe, filterQuery]);

      // Sort sectors based on selected sort option
      const sortedSectors = useMemo(() => {
        const list = [...processedSectors];
        if (sortBy === 'perf') {
          list.sort((a, b) => b.currentTfReturn - a.currentTfReturn);
        } else if (sortBy === 'laggard') {
          list.sort((a, b) => a.currentTfReturn - b.currentTfReturn);
        } else if (sortBy === 'volume') {
          list.sort((a, b) => (b.totalValue || 0) - (a.totalValue || 0));
        }
        return list;
      }, [processedSectors, sortBy]);

      // Top Sector Winners & Losers for Rotation Insight
      const sectorWinners = useMemo(() => {
        return [...processedSectors].sort((a, b) => b.currentTfReturn - a.currentTfReturn).slice(0, 3);
      }, [processedSectors]);

      const sectorLosers = useMemo(() => {
        return [...processedSectors].sort((a, b) => a.currentTfReturn - b.currentTfReturn).slice(0, 3);
      }, [processedSectors]);

      // Top Individual Stock Winners in this timeframe
      const topIndividualWinners = useMemo(() => {
        const allStocks = [];
        heatmapData.forEach(sec => {
          (sec.stocks || []).forEach(st => {
            allStocks.push({
              ...st,
              sectorName: sec.sector,
              tfRet: Number(st.timeframeReturns?.[timeframe] ?? st.changePct ?? 0)
            });
          });
        });
        return allStocks.sort((a, b) => b.tfRet - a.tfRet).slice(0, 4);
      }, [heatmapData, timeframe]);

      // Dynamic color class for return pills
      const getReturnStyle = (pct) => {
        const num = Number(pct);
        if (num >= 5.0) return 'bg-emerald-500/20 text-emerald-300 border-emerald-500/60 shadow-emerald-500/20 shadow-md font-black';
        if (num > 0) return 'bg-emerald-950/40 text-emerald-400 border-emerald-500/40 font-bold';
        if (num === 0) return 'bg-slate-900/60 text-slate-400 border-slate-700/50 font-bold';
        if (num > -5.0) return 'bg-rose-950/40 text-rose-400 border-rose-500/40 font-bold';
        return 'bg-rose-500/20 text-rose-300 border-rose-500/60 shadow-rose-500/20 shadow-md font-black';
      };

      if (!heatmapData || heatmapData.length === 0) {
        return (
          <div className="bg-dark-900 border border-dark-700 rounded-3xl p-12 text-center space-y-4 shadow-2xl">
            <div className="w-16 h-16 rounded-3xl bg-indigo-500/20 border border-indigo-500/40 flex items-center justify-center text-3xl mx-auto">
              🗺️
            </div>

    // =========================================================================
    // Master-Trader Chart Modal (Volume Profile POC, EMA 5/20/50, MACD, RSI, Financials)
    // =========================================================================
    function ChartModal({ symbol, targetDate, market, activeSessionDate, initialTab = 'chart', onClose }) {
      const [chartData, setChartData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [activeTab, setActiveTab] = useState(initialTab || 'chart'); // 'chart' | 'news'
      const [newsItems, setNewsItems] = useState([]);
      const [catalystAnalysis, setCatalystAnalysis] = useState(null);
      const [loadingNews, setLoadingNews] = useState(false);
      const canvasRef = useRef(null);
      const currency = market === 'TH' ? '฿' : '$';

      useEffect(() => {
        if (initialTab) setActiveTab(initialTab);
      }, [initialTab]);

      useEffect(() => {
        if (!symbol) return;
        setLoadingNews(true);
        fetch(`/api/news/${encodeURIComponent(symbol)}?market=${market || 'TH'}`)
          .then(res => res.json())
          .then(d => {
            if (d && d.news) setNewsItems(d.news);
            if (d && d.catalystAnalysis) setCatalystAnalysis(d.catalystAnalysis);
            setLoadingNews(false);
          })
          .catch(() => setLoadingNews(false));
      }, [symbol, market]);

      useEffect(() => {
        let isMounted = true;
        setLoading(true);
        setError(null);

        const fetchChart = async () => {
          try {
            const url = `/api/chart/${symbol}?market=${market || 'TH'}${targetDate ? `&date=${targetDate}` : ''}`;
            const res = await fetch(url);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            if (!data.success) throw new Error(data.error || 'Failed to load chart');
            if (isMounted) setChartData(data);
          } catch (err) {
            if (isMounted) setError(err.message);
          } finally {
            if (isMounted) setLoading(false);
          }
        };

        fetchChart();
        return () => { isMounted = false; };
      }, [symbol, targetDate, market]);

      // Draw Candlestick, EMAs 5/20/50, Two-Tone POC, MACD, RSI on Canvas
      useEffect(() => {
        if (!chartData || !canvasRef.current || !chartData.candles || chartData.candles.length === 0) return;

        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();

        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);

        const width = rect.width;
        const height = rect.height;

        ctx.clearRect(0, 0, width, height);

        // Sub-panel layouts
        const mainChartHeight = height * 0.58;
        const macdTop = height * 0.60;
        const macdHeight = height * 0.18;
        const rsiTop = height * 0.80;
        const rsiHeight = height * 0.17;

        const leftMargin = 10;
        const rightMargin = 75;
        const profileWidth = 75;
        const plotWidth = width - leftMargin - rightMargin - profileWidth;

        const allCandles = chartData.candles;
        const isHistorical = chartData.isHistorical;
        const targetIndex = chartData.targetIndex;

        // Slice candles around target
        let visibleCandles = allCandles;
        let adjustedTargetIdx = targetIndex;

        if (isHistorical && targetIndex >= 0) {
          const startIdx = Math.max(0, targetIndex - 50);
          const endIdx = Math.min(allCandles.length - 1, targetIndex + 15);
          visibleCandles = allCandles.slice(startIdx, endIdx + 1);
          adjustedTargetIdx = targetIndex - startIdx;
        } else {
          visibleCandles = allCandles.slice(-65);
          adjustedTargetIdx = visibleCandles.length - 1;
        }

        const candles = visibleCandles;
        if (candles.length === 0) return;

        // Find min/max price
        let minPrice = Infinity;
        let maxPrice = -Infinity;
        candles.forEach(c => {
          if (c.low < minPrice) minPrice = c.low;
          if (c.high > maxPrice) maxPrice = c.high;
        });
        const pricePadding = (maxPrice - minPrice) * 0.08 || 1;
        minPrice -= pricePadding;
        maxPrice += pricePadding;
        const priceRange = maxPrice - minPrice;

        const padTop = 15;
        const padBottom = 15;
        const usableMainHeight = mainChartHeight - padTop - padBottom;
        const getY = (price) => padTop + usableMainHeight - ((price - minPrice) / priceRange) * usableMainHeight;

        // Background grid
        ctx.strokeStyle = '#111827';
        ctx.lineWidth = 1;
        ctx.strokeRect(leftMargin, padTop, plotWidth, usableMainHeight);

        // Price Axis Grid lines
        const gridSteps = 5;
        for (let i = 0; i <= gridSteps; i++) {
          const p = minPrice + (priceRange * (i / gridSteps));
          const y = getY(p);
          ctx.beginPath();
          ctx.moveTo(leftMargin, y);
          ctx.lineTo(leftMargin + plotWidth, y);
          ctx.stroke();

          ctx.fillStyle = '#64748b';
          ctx.font = '10px JetBrains Mono';
          ctx.fillText(`${currency}${p.toFixed(2)}`, leftMargin + plotWidth + profileWidth + 6, y + 3);
        }

        // Draw Candlesticks
        const barWidth = Math.max(3, (plotWidth / candles.length) - 3);

        // Target Date Marker Line
        if (isHistorical && adjustedTargetIdx >= 0 && adjustedTargetIdx < candles.length) {
          const targetX = leftMargin + (adjustedTargetIdx * (plotWidth / candles.length)) + (barWidth / 2);
          ctx.fillStyle = 'rgba(245, 158, 11, 0.15)';
          ctx.fillRect(targetX - (barWidth / 2) - 4, padTop, barWidth + 8, mainChartHeight);

          ctx.strokeStyle = '#f59e0b';
          ctx.lineWidth = 1.5;
          ctx.setLineDash([4, 4]);
          ctx.beginPath();
          ctx.moveTo(targetX, padTop);
          ctx.lineTo(targetX, padTop + mainChartHeight);
          ctx.stroke();
          ctx.setLineDash([]);

          ctx.fillStyle = '#f59e0b';
          ctx.font = 'bold 11px Prompt';
          ctx.fillText(`🎯 วันที่สแกน (${candles[adjustedTargetIdx]?.dateStr})`, targetX - 50, padTop - 8);
        }

        candles.forEach((c, idx) => {
          const x = leftMargin + (idx * (plotWidth / candles.length)) + (barWidth / 2);
          const yOpen = getY(c.open);
          const yClose = getY(c.close);
          const yHigh = getY(c.high);
          const yLow = getY(c.low);

          const isBull = c.close >= c.open;
          ctx.strokeStyle = isBull ? '#10b981' : '#f43f5e';
          ctx.fillStyle = isBull ? '#10b981' : '#f43f5e';
          ctx.lineWidth = 1.2;

          ctx.beginPath();
          ctx.moveTo(x, yHigh);
          ctx.lineTo(x, yLow);
          ctx.stroke();

          const candleTop = Math.min(yOpen, yClose);
          const candleHeight = Math.max(2, Math.abs(yOpen - yClose));
          ctx.fillRect(x - (barWidth / 2), candleTop, barWidth, candleHeight);
        });

        // --- CLASSIC VOLUME HISTOGRAM AT BOTTOM OF CANDLESTICK PANEL ---
        const maxVol = Math.max(...candles.map(c => c.volume || 0), 1);
        const volZoneHeight = usableMainHeight * 0.22;
        const volBaselineY = padTop + usableMainHeight;

        candles.forEach((c, idx) => {
          const x = leftMargin + (idx * (plotWidth / candles.length)) + (barWidth / 2);
          const v = c.volume || 0;
          const vHeight = Math.max(1, (v / maxVol) * volZoneHeight);
          const isBull = c.close >= c.open;
          ctx.fillStyle = isBull ? 'rgba(16, 185, 129, 0.40)' : 'rgba(244, 63, 94, 0.40)';
          ctx.fillRect(x - (barWidth / 2), volBaselineY - vHeight, barWidth, vHeight);
        });

        // 20-Day Volume Moving Average Line
        const vol20Arr = candles.map((_, i, arr) => {
          if (i < 9) return null;
          const len = Math.min(20, i + 1);
          const slice = arr.slice(i - len + 1, i + 1);
          return slice.reduce((sum, c) => sum + (c.volume || 0), 0) / len;
        });
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.65)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        let volMaStarted = false;
        candles.forEach((c, idx) => {
          const vma = vol20Arr[idx];
          if (vma) {
            const x = leftMargin + (idx * (plotWidth / candles.length)) + (barWidth / 2);
            const y = volBaselineY - ((vma / maxVol) * volZoneHeight);
            if (!volMaStarted) { ctx.moveTo(x, y); volMaStarted = true; }
            else { ctx.lineTo(x, y); }
          }
        });
        if (volMaStarted) ctx.stroke();

        // X-Axis Date Ticks & Labels (Displays exact 2026-09-11 date clearly)
        ctx.font = 'bold 9px JetBrains Mono';
        const labelInterval = Math.max(6, Math.floor(candles.length / 8));
        candles.forEach((c, idx) => {
          if (idx % labelInterval === 0 || idx === candles.length - 1 || idx === adjustedTargetIdx) {
            const x = leftMargin + (idx * (plotWidth / candles.length)) + (barWidth / 2);
            const isLast = idx === candles.length - 1;
            const isTarget = idx === adjustedTargetIdx;

            ctx.strokeStyle = isLast ? '#10b981' : isTarget ? '#f59e0b' : '#334155';
            ctx.lineWidth = isLast || isTarget ? 1.5 : 1;
            ctx.beginPath();
            ctx.moveTo(x, volBaselineY);
            ctx.lineTo(x, volBaselineY + 5);
            ctx.stroke();

            ctx.fillStyle = isLast ? '#34d399' : isTarget ? '#fbbf24' : '#64748b';
            const dateShort = c.dateStr ? c.dateStr.slice(5) : '';
            ctx.fillText(dateShort, Math.max(leftMargin, x - 13), volBaselineY + 14);
          }
        });

        // Draw EMA 5, EMA 20, EMA 50 Lines (REQUEST 6)
        const drawIndicatorLine = (field, color, lineWidth = 1.5) => {
          ctx.strokeStyle = color;
          ctx.lineWidth = lineWidth;
          ctx.beginPath();
          let started = false;

          candles.forEach((c, idx) => {
            const val = c[field];
            if (val !== undefined && val !== null && val > 0) {
              const x = leftMargin + (idx * (plotWidth / candles.length)) + (barWidth / 2);
              const y = getY(val);
              if (!started) {
                ctx.moveTo(x, y);
                started = true;
              } else {
                ctx.lineTo(x, y);
              }
            }
          });
          if (started) ctx.stroke();
        };

        drawIndicatorLine('ema5', '#facc15', 1.5);  // EMA 5: Yellow
        drawIndicatorLine('ema20', '#38bdf8', 1.8); // EMA 20: Cyan
        drawIndicatorLine('ema50', '#a855f7', 1.8); // EMA 50: Purple (Upgraded from 25 to 50)

        // --- TWO-TONE VOLUME PROFILE & POC (IMAGE 3 & REQUEST 5) ---
        if (chartData.volumeProfile && chartData.volumeProfile.bins) {
          const vp = chartData.volumeProfile;
          const bins = vp.bins;
          const maxBinVol = vp.maxBinVol || Math.max(...bins.map(b => b.totalVolume || b.volume || 1), 1);
          const profileLeft = leftMargin + plotWidth + 4;

          bins.forEach(b => {
            const yCenter = getY(b.price);
            const bHeight = Math.max(3, (usableMainHeight / bins.length) - 1);
            const totVol = b.totalVolume || b.volume || 0;
            const bWidth = (totVol / maxBinVol) * (profileWidth - 8);
            const isPoc = b.price === vp.poc;

            // Two-tone Volume Profile (Image 3: Buy Vol Blue, Sell Vol Orange)
            const buyPortion = totVol > 0 ? ((b.buyVolume || (totVol * 0.55)) / totVol) : 0.55;
            const buyWidth = bWidth * buyPortion;
            const sellWidth = bWidth - buyWidth;

            // Buy volume bar (Cyan/Blue)
            ctx.fillStyle = isPoc ? '#38bdf8' : 'rgba(56, 189, 248, 0.75)';
            ctx.fillRect(profileLeft, yCenter - (bHeight / 2), buyWidth, bHeight);

            // Sell volume bar (Orange/Amber)
            ctx.fillStyle = isPoc ? '#f59e0b' : 'rgba(245, 158, 11, 0.75)';
            ctx.fillRect(profileLeft + buyWidth, yCenter - (bHeight / 2), sellWidth, bHeight);
          });

          // Draw Horizontal POC Line & Badge
          if (vp.poc) {
            const pocY = getY(vp.poc);
            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 1.8;
            ctx.setLineDash([5, 3]);
            ctx.beginPath();
            ctx.moveTo(leftMargin, pocY);
            ctx.lineTo(leftMargin + plotWidth + profileWidth, pocY);
            ctx.stroke();
            ctx.setLineDash([]);

            // POC Badge
            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(leftMargin + plotWidth + profileWidth + 4, pocY - 9, 56, 18);
            ctx.fillStyle = '#060911';
            ctx.font = 'bold 10px JetBrains Mono';
            ctx.fillText(`POC:${vp.poc}`, leftMargin + plotWidth + profileWidth + 6, pocY + 4);
          }
        }

        // --- MACD SUB-PANEL ---
        ctx.strokeStyle = '#1e2d4a';
        ctx.lineWidth = 1;
        ctx.strokeRect(leftMargin, macdTop, plotWidth, macdHeight);

        let maxMacd = -Infinity, minMacd = Infinity;
        candles.forEach(c => {
          if (c.macd !== undefined) {
            if (c.macd > maxMacd) maxMacd = c.macd;
            if (c.macd < minMacd) minMacd = c.macd;
            if (c.macdSignal > maxMacd) maxMacd = c.macdSignal;
            if (c.macdSignal < minMacd) minMacd = c.macdSignal;
            if (c.macdHist > maxMacd) maxMacd = c.macdHist;
            if (c.macdHist < minMacd) minMacd = c.macdHist;
          }
        });
        const macdRange = Math.max(0.1, maxMacd - minMacd);
        const getMacdY = (val) => macdTop + macdHeight - ((val - minMacd) / macdRange) * macdHeight;
        const macdZeroY = getMacdY(0);

        ctx.strokeStyle = '#334155';
        ctx.setLineDash([2, 2]);
        ctx.beginPath();
        ctx.moveTo(leftMargin, macdZeroY);
        ctx.lineTo(leftMargin + plotWidth, macdZeroY);
        ctx.stroke();
        ctx.setLineDash([]);

        // MACD Histogram
        candles.forEach((c, idx) => {
          if (c.macdHist !== undefined) {
            const x = leftMargin + (idx * (plotWidth / candles.length)) + (barWidth / 2);
            const yHist = getMacdY(c.macdHist);
            ctx.fillStyle = c.macdHist >= 0 ? '#10b981' : '#f43f5e';
            const hTop = Math.min(yHist, macdZeroY);
            const hHeight = Math.max(1, Math.abs(yHist - macdZeroY));
            ctx.fillRect(x - (barWidth / 2), hTop, barWidth, hHeight);
          }
        });

        // MACD Line & Signal Line
        const drawMacdLine = (field, color) => {
          ctx.strokeStyle = color;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          let started = false;
          candles.forEach((c, idx) => {
            if (c[field] !== undefined) {
              const x = leftMargin + (idx * (plotWidth / candles.length)) + (barWidth / 2);
              const y = getMacdY(c[field]);
              if (!started) { ctx.moveTo(x, y); started = true; }
              else { ctx.lineTo(x, y); }
            }
          });
          if (started) ctx.stroke();
        };
        drawMacdLine('macd', '#38bdf8');       // MACD: Cyan
        drawMacdLine('macdSignal', '#fb923c'); // Signal: Orange

        ctx.fillStyle = '#94a3b8';
        ctx.font = 'bold 10px JetBrains Mono';
        ctx.fillText('MACD (12, 26, 9)', leftMargin + 6, macdTop + 14);

        // --- RSI SUB-PANEL ---
        ctx.strokeStyle = '#1e2d4a';
        ctx.lineWidth = 1;
        ctx.strokeRect(leftMargin, rsiTop, plotWidth, rsiHeight);

        const getRsiY = (val) => rsiTop + rsiHeight - (val / 100) * rsiHeight;
        const rsi70Y = getRsiY(70);
        const rsi30Y = getRsiY(30);

        ctx.strokeStyle = '#334155';
        ctx.setLineDash([3, 3]);
        ctx.beginPath();
        ctx.moveTo(leftMargin, rsi70Y);
        ctx.lineTo(leftMargin + plotWidth, rsi70Y);
        ctx.moveTo(leftMargin, rsi30Y);
        ctx.lineTo(leftMargin + plotWidth, rsi30Y);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = '#64748b';
        ctx.font = '9px JetBrains Mono';
        ctx.fillText('70', leftMargin + plotWidth + profileWidth + 4, rsi70Y + 3);
        ctx.fillText('30', leftMargin + plotWidth + profileWidth + 4, rsi30Y + 3);

        // Draw RSI Line
        ctx.strokeStyle = '#c084fc'; // RSI: Purple
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        let rsiStarted = false;
        candles.forEach((c, idx) => {
          if (c.rsi !== undefined) {
            const x = leftMargin + (idx * (plotWidth / candles.length)) + (barWidth / 2);
            const y = getRsiY(c.rsi);
            if (!rsiStarted) { ctx.moveTo(x, y); rsiStarted = true; }
            else { ctx.lineTo(x, y); }
          }
        });
        if (rsiStarted) ctx.stroke();

        // Draw RSI SMA Line
        ctx.strokeStyle = '#fbbf24'; // RSI SMA: Amber
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        let smaStarted = false;
        candles.forEach((c, idx) => {
          if (c.rsiSma !== undefined) {
            const x = leftMargin + (idx * (plotWidth / candles.length)) + (barWidth / 2);
            const y = getRsiY(c.rsiSma);
            if (!smaStarted) { ctx.moveTo(x, y); smaStarted = true; }
            else { ctx.lineTo(x, y); }
          }
        });
        if (smaStarted) ctx.stroke();

        const lastRsi = candles[candles.length - 1]?.rsi || 50;
        ctx.fillStyle = '#94a3b8';
        ctx.font = 'bold 10px JetBrains Mono';
        ctx.fillText(`RSI 14: ${lastRsi}`, leftMargin + 6, rsiTop + 14);

                        <td className="px-3 py-1.5 text-indigo-300 font-bold bg-dark-900/40">
                          {chartData.financials.yearMap?.['2026']?.sumRev ? chartData.financials.yearMap['2026'].sumRev.toLocaleString(undefined, { maximumFractionDigits: 1 }) : '-'}
                        </td>
                      </tr>

                      {/* 2025 Revenue */}
                      <tr className="bg-dark-900/20 text-slate-400">
                        <td className="px-3 py-1.5 text-left text-slate-400 font-bold">
                          2025 <span className="text-[10px] text-slate-400 font-normal">(รายได้รวม)</span>
                        </td>
                        {['Q1', 'Q2', 'Q3', 'Q4'].map(q => {
                          const val = chartData.financials.yearMap?.['2025']?.[q]?.rev;
                          return (
                            <td key={q} className="px-3 py-1.5 text-slate-400">
                              {val !== undefined && val !== null ? val.toLocaleString() : '-'}
                            </td>
                          );
                        })}
                        <td className="px-3 py-1.5 text-slate-300 font-bold bg-dark-900/40">
                          {chartData.financials.yearMap?.['2025']?.sumRev ? chartData.financials.yearMap['2025'].sumRev.toLocaleString(undefined, { maximumFractionDigits: 1 }) : '-'}
                        </td>
                      </tr>
                      {/* Quality Row (Image 2) */}
                      <tr className="bg-dark-900/60 text-[10px] text-slate-400">
                        <td className="px-3 py-1 text-left font-bold text-slate-300">Quality Checklist</td>
                        <td className="px-3 py-1 text-emerald-400">Q: 2/4 ผ่าน</td>
                        <td className="px-3 py-1 text-slate-500">-</td>
                        <td className="px-3 py-1 text-emerald-400">Vol Dry (แห้ง)</td>
                        <td className="px-3 py-1 text-slate-500">-</td>
                        <td className="px-3 py-1 text-emerald-300 font-bold">EMA 5/20/50 Rising</td>
                      </tr>
                      {/* Trigger Row (Image 2) */}
                      <tr className="bg-dark-900/80 text-[10px] text-slate-400">
                        <td className="px-3 py-1 text-left font-bold text-slate-300">Trigger Signal</td>
                        <td className="px-3 py-1 text-emerald-400 font-bold">ST UP</td>
                        <td className="px-3 py-1 text-emerald-400 font-bold">Val OK</td>
                        <td className="px-3 py-1 text-amber-400 font-bold">STO WAIT</td>
                        <td className="px-3 py-1 text-emerald-400 font-bold">EXT OK</td>
                        <td className="px-3 py-1 text-purple-300 font-bold">PULLBACK READY</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* INTRADAY EMA (H1 / H2 / H4) STATUS DASHBOARD CARD */}
            {chartData && chartData.intradayEma && (
              <div className="bg-dark-950 border border-indigo-500/30 rounded-2xl p-3.5 space-y-2.5 font-mono">
                <div className="flex flex-wrap items-center justify-between gap-2 border-b border-dark-800 pb-2 text-xs">
                  <div className="flex items-center space-x-2">
                    <span className="text-base">⏱️</span>
                    <span className="font-bold text-slate-200">
                      สถานะแท่งเทียนในโซน EMA (H1 / H2 / H4) - {chartData.symbol}:
                    </span>
                    {chartData.intradayEma.tripleConfluence && (
                      <span className="px-2.5 py-0.5 rounded-full font-black text-[10px] bg-gradient-to-r from-purple-500/25 to-indigo-500/25 text-purple-300 border border-purple-500/40 animate-pulse">
                        👑 Triple Confluence Bull
                      </span>
                    )}
                    {!chartData.intradayEma.tripleConfluence && chartData.intradayEma.inAnyZone && (
                      <span className="px-2.5 py-0.5 rounded-full font-bold text-[10px] bg-emerald-500/20 text-emerald-300 border border-emerald-500/40">
                        ⚡ In Bull Zone
                      </span>
                    )}
                  </div>

                  <div className="text-[11px] text-slate-400">
                    เกณฑ์: ราคาปิด &gt; EMA 20, 50, 200 ในแต่ละ Timeframe
                  </div>
                </div>

                {/* 3 Columns: H1 (60m), H2 (120m), H4 (240m) */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                  {[
                    { id: 'h1', label: 'H1 (60 นาที)', color: 'emerald', data: chartData.intradayEma.h1 },
                    { id: 'h2', label: 'H2 (120 นาที)', color: 'sky', data: chartData.intradayEma.h2 },
                    { id: 'h4', label: 'H4 (240 นาที)', color: 'purple', data: chartData.intradayEma.h4 }
                  ].map(tf => {
                    const d = tf.data;
                    if (!d) return null;
                    return (
                      <div key={tf.id} className="bg-dark-900/90 border border-dark-800 rounded-xl p-3 space-y-2">
                        <div className="flex items-center justify-between border-b border-dark-800/80 pb-1.5">
                          <span className="text-xs font-bold text-slate-200">{tf.label}</span>
                          <span className={`px-2 py-0.5 rounded text-[10px] font-bold border ${
                            d.aboveAll
                              ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40'
                              : d.above20
                              ? 'bg-indigo-500/20 text-indigo-300 border-indigo-500/30'
                              : 'bg-rose-500/10 text-rose-400 border-rose-500/20'
                          }`}>
                            {d.aboveAll ? '🟢 Bull Zone (เหนือ 20/50/200)' : d.above20 ? '🟡 เหนือ EMA20' : '🔴 ใต้เส้น EMA'}
                          </span>
                        </div>

                        <div className="text-xs flex items-baseline justify-between">
                          <span className="text-slate-400">ราคาแท่งปิด:</span>
                          <span className="font-bold text-white text-sm">{currency}{d.close?.toFixed(2)}</span>
                        </div>

                        {/* EMA 20, 50, 200 comparison breakdown */}
                        <div className="space-y-1 text-[11px] pt-1">
                          <div className="flex items-center justify-between bg-dark-950 px-2 py-1 rounded">
                            <span className="text-sky-400 font-bold">EMA 20:</span>
                            <div className="flex items-center space-x-2">
                              <span className="text-slate-300">{currency}{d.ema20?.toFixed(2)}</span>
                              <span className={`font-bold ${d.above20 ? 'text-emerald-400' : 'text-rose-400'}`}>
                                {d.diff20Pct > 0 ? '+' : ''}{d.diff20Pct}% {d.above20 ? '✓' : '✗'}
                              </span>
                            </div>
                          </div>

                          <div className="flex items-center justify-between bg-dark-950 px-2 py-1 rounded">
                            <span className="text-purple-400 font-bold">EMA 50:</span>
                            <div className="flex items-center space-x-2">
                              <span className="text-slate-300">{currency}{d.ema50?.toFixed(2)}</span>
                              <span className={`font-bold ${d.above50 ? 'text-emerald-400' : 'text-rose-400'}`}>
                                {d.diff50Pct > 0 ? '+' : ''}{d.diff50Pct}% {d.above50 ? '✓' : '✗'}
                              </span>
                            </div>
                          </div>

                          <div className="flex items-center justify-between bg-dark-950 px-2 py-1 rounded">
                            <span className="text-amber-400 font-bold">EMA 200:</span>
                            <div className="flex items-center space-x-2">
                              <span className="text-slate-300">{currency}{d.ema200?.toFixed(2)}</span>
                              <span className={`font-bold ${d.above200 ? 'text-emerald-400' : 'text-rose-400'}`}>
                                {d.diff200Pct > 0 ? '+' : ''}{d.diff200Pct}% {d.above200 ? '✓' : '✗'}
                              </span>
                            </div>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* Technical Indicators Legend (EMA 5/20/50 - REQUEST 6) */}
            <div className="flex flex-wrap items-center gap-3 text-[11px] font-mono bg-dark-950 p-2.5 rounded-xl border border-dark-800">
              <div className="flex items-center space-x-1.5"><span className="w-3 h-1 bg-[#facc15] rounded"></span><span className="text-amber-300 font-bold">EMA 5</span></div>
              <div className="flex items-center space-x-1.5"><span className="w-3 h-1 bg-[#38bdf8] rounded"></span><span className="text-sky-300 font-bold">EMA 20</span></div>
              <div className="flex items-center space-x-1.5"><span className="w-3 h-1 bg-[#a855f7] rounded"></span><span className="text-purple-400 font-bold">EMA 50</span></div>
              <div className="flex items-center space-x-1.5">
                <span className="w-3 h-1 bg-[#38bdf8] rounded-l"></span>
                <span className="w-3 h-1 bg-[#f59e0b] rounded-r"></span>
                <span className="text-amber-400 font-bold">Volume Profile (Buy/Sell) + POC</span>
              </div>
              <div className="flex items-center space-x-1.5"><span className="w-2.5 h-2.5 bg-emerald-500 rounded-sm"></span><span>MACD</span></div>
              <div className="flex items-center space-x-1.5"><span className="w-3 h-1 bg-[#c084fc] rounded"></span><span className="text-purple-300">RSI 14 + SMA</span></div>
            </div>

            {loading ? (
              <div className="h-[520px] flex items-center justify-center space-x-2 text-slate-400">
                <div className="w-6 h-6 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
                <span>กำลังโหลดข้อมูลกราฟ Fact พร้อม EMA 5/20/50, MACD, RSI, Volume Profile POC, และงบการเงิน...</span>
              </div>
            ) : error ? (
              <div className="h-[520px] flex items-center justify-center text-rose-400">
                {error}
              </div>
            ) : (
              <div className="relative w-full h-[540px]">
                <canvas ref={canvasRef} className="w-full h-full block" />
              </div>
            )}
            </>
            )}

            <div className="flex justify-between items-center text-xs text-slate-400 pt-2 border-t border-dark-800">
              <div className="flex items-center space-x-3">
                <span>เส้นประสีเหลือง = วันที่สแกนติด</span>
                <span>•</span>
                <span>แถบสีฟ้า/ส้มด้านขวา = Two-Tone Volume Profile (วอลุ่มซื้อฝั่งฟ้า / ขายฝั่งส้ม)</span>
                <span>•</span>
                <span>เส้นประสีส้ม = POC (ราคาวอลุ่มสะสมสูงสุด)</span>
              </div>
              <button onClick={onClose} className="px-4 py-1.5 rounded-xl bg-dark-800 hover:bg-dark-700 text-slate-200 font-bold">
                ปิดหน้าต่าง
              </button>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // Position Sizer Modal Component
    // =========================================================================
    function PositionCalculatorModal({ stock, currency, onClose }) {
      const [capital, setCapital] = useState(1000000);
      const [riskPct, setRiskPct] = useState(2.0);

      const riskPerShare = Math.max(0.01, stock.pivotBuy - stock.stopLoss);
      const totalRiskCapital = capital * (riskPct / 100);
      const maxShares = Math.floor(totalRiskCapital / riskPerShare);
      const totalInvestment = maxShares * stock.pivotBuy;
      const portfolioPct = capital > 0 ? (totalInvestment / capital) * 100 : 0;

      const tp1Reward = maxShares * Math.max(0, (stock.targetPrice1 || stock.targetPrice) - stock.pivotBuy);
      const tp2Reward = maxShares * Math.max(0, (stock.targetPrice2 || (stock.pivotBuy * 1.1)) - stock.pivotBuy);

      return (
        <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-dark-900 border border-dark-700 w-full max-w-lg rounded-3xl p-6 shadow-2xl space-y-4">
            <div className="flex justify-between items-center border-b border-dark-800 pb-3">
              <div className="flex items-center space-x-2">
                <span className="text-xl">🧮</span>
                <h3 className="text-lg font-black text-white">คำนวณเงินและขนาดไม้: <span className="text-indigo-400 font-mono">{stock.symbol}</span></h3>
              </div>
              <button onClick={onClose} className="w-8 h-8 rounded-full bg-dark-800 hover:bg-dark-700 text-slate-400 hover:text-white flex items-center justify-center">✕</button>
            </div>

            <div className="space-y-3 text-xs">
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-slate-400 block mb-1">เงินทุนในพอร์ต ({currency}):</label>
                  <input
                    type="number"
                    value={capital}
                    onChange={(e) => setCapital(parseFloat(e.target.value) || 0)}
                    className="w-full bg-dark-950 border border-dark-700 px-3 py-2 rounded-xl font-mono text-slate-100 font-bold focus:border-indigo-400 outline-none"
                  />
                </div>
                <div>
                  <label className="text-slate-400 block mb-1">ความเสี่ยงต่อไม้ (% Risk):</label>
                  <input
                    type="number"
                    step="0.5"
                    value={riskPct}
                    onChange={(e) => setRiskPct(parseFloat(e.target.value) || 0)}
                    className="w-full bg-dark-950 border border-dark-700 px-3 py-2 rounded-xl font-mono text-slate-100 font-bold focus:border-indigo-400 outline-none"
                  />
                </div>
              </div>

              <div className="bg-dark-950 p-4 rounded-2xl border border-dark-800 space-y-2 font-mono text-xs">
                <div className="flex justify-between">
                  <span className="text-slate-400">จุดซื้อ (Pivot Buy):</span>
                  <span className="font-bold text-amber-400">{currency}{stock.pivotBuy.toFixed(2)}</span>
                </div>
                <div className="flex justify-between">
                  <span className="text-slate-400">จุดตัดขาดทุน (Stop Loss):</span>
                  <span className="font-bold text-rose-400">{currency}{stock.stopLoss.toFixed(2)}</span>
                </div>
                <div className="flex justify-between">
                  <span className="text-slate-400">ความเสี่ยงต่อหุ้น:</span>
                  <span className="font-bold text-slate-200">{currency}{riskPerShare.toFixed(2)} / หุ้น</span>
                </div>
                <div className="border-t border-dark-800 pt-2 flex justify-between text-sm">
                  <span className="text-indigo-300 font-bold">จำนวนหุ้นที่แนะนำให้ซื้อ:</span>
                  <span className="font-black text-indigo-400">{maxShares.toLocaleString()} หุ้น</span>
                </div>
                <div className="flex justify-between text-slate-300">
                  <span>มูลค่าเงินลงทุนไม้นี้:</span>
                  <span>{currency}{totalInvestment.toLocaleString()} ({portfolioPct.toFixed(1)}% ของพอร์ต)</span>
                </div>
              </div>

              <div className="grid grid-cols-2 gap-2 text-center font-mono">
                <div className="p-3 bg-rose-950/20 border border-rose-500/30 rounded-xl">
                  <span className="text-[10px] text-rose-400 block">ขาดทุนสูงสุด (Max Risk):</span>
                  <span className="font-black text-rose-400 text-sm">-{currency}{totalRiskCapital.toLocaleString()}</span>
                </div>
                <div className="p-3 bg-emerald-950/20 border border-emerald-500/30 rounded-xl">
                  <span className="text-[10px] text-emerald-400 block">กำไรเป้า 1 (TP1 Reward):</span>
                  <span className="font-black text-emerald-400 text-sm">+{currency}{tp1Reward.toLocaleString()}</span>
                </div>
              </div>
            </div>

            <button
              onClick={onClose}
              className="w-full bg-dark-800 hover:bg-dark-700 text-white font-bold py-2 rounded-xl text-xs"
            >
              ปิดหน้าต่าง
            </button>
          </div>
        </div>
      );
    }

    // Render React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
